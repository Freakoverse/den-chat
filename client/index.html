<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Bootstrap recovery (web only). If an initial JS chunk fails to load — e.g. a
      // deploy/CDN race briefly serves an index.html whose hashed chunks aren't all
      // propagated yet — React never mounts and the page is blank. The in-app reload
      // handler can't help here: it lives inside the React tree that never rendered.
      // This reloads once (twice max) to fetch a consistent asset set. Count-guarded
      // so it can never loop forever; the counter resets on a successful mount.
      (function () {
        if (window.__TAURI_INTERNALS__) return // desktop bundles assets locally
        var KEY = 'den-boot-retries'
        function mounted() {
          var r = document.getElementById('root')
          return !!(r && r.childElementCount > 0)
        }
        function showFallback() {
          if (mounted() || document.getElementById('den-boot-fallback')) return
          var d = document.createElement('div')
          d.id = 'den-boot-fallback'
          d.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#121212;color:#e5e5e5;font:14px/1.5 system-ui,-apple-system,sans-serif;padding:24px')
          d.innerHTML =
            '<div style="max-width:440px;text-align:center">'
            + '<div style="font-size:18px;font-weight:600;margin-bottom:10px">DEN Chat couldn’t load</div>'
            + '<div style="opacity:.85;margin-bottom:16px">The app’s scripts didn’t start. This is almost always something on this device or network blocking them — an ad-blocker or privacy extension, security/antivirus software, or a restrictive network/DNS — not the app itself (it loads fine elsewhere).</div>'
            + '<div style="opacity:.85;margin-bottom:18px;text-align:left">Try, in order:<ul style="margin:8px 0 0;padding-left:20px"><li>Open a private/incognito window with extensions off</li><li>Pause any ad-blocker (Opera GX has one built in) for this site</li><li>Try a different network (e.g. a phone hotspot)</li></ul></div>'
            + '<button id="den-boot-retry" style="background:#4A6CF7;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer">Reload</button>'
            + '</div>'
          try { document.body.appendChild(d) } catch (e) { return }
          var btn = document.getElementById('den-boot-retry')
          if (btn) btn.addEventListener('click', function () {
            try { sessionStorage.removeItem(KEY) } catch (e) {}
            location.reload()
          })
        }
        function recover() {
          if (mounted()) return
          var n = 0
          try { n = parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0 } catch (e) {}
          if (n >= 2) { showFallback(); return } // gave up reloading — show an actionable message, not a blank page
          try { sessionStorage.setItem(KEY, String(n + 1)) } catch (e) {}
          // Nuke a stale/broken service-worker + its caches before reloading. A network-first SW
          // serves fresh assets when online, but if a bad build got cached (a stale index.html
          // pointing at purged asset hashes, or a corrupt cached chunk), a plain reload just
          // re-serves the same broken cache and the page stays blank forever. Clearing them forces
          // the reload to fetch a clean, consistent asset set. Reload once cleanup settles (or after
          // a short timeout so a hung cleanup can't wedge us). The SW re-registers on the next load.
          var done = false
          function go() {
            if (done) return; done = true
            // Cache-bust the navigation. The usual root cause is a stale index.html pinned in the
            // HTTP/CDN cache (served with a max-age it hasn't outlived) that still points at deleted,
            // post-deploy asset hashes — a plain reload re-serves that same "fresh" cached copy and
            // stays blank. A unique query forces the browser/CDN to fetch the CURRENT index.html.
            try {
              var loc = window.location
              var params = new URLSearchParams(loc.search)
              params.set('_denr', String(Date.now()))
              var q = params.toString()
              loc.replace(loc.pathname + (q ? '?' + q : '') + loc.hash)
            } catch (e) { try { window.location.reload() } catch (_) {} }
          }
          try {
            var jobs = []
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }).catch(function () {}))
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }).catch(function () {}))
            }
            Promise.all(jobs).then(go, go)
            setTimeout(go, 1500)
          } catch (e) { go() }
        }
        // An entry <script> or a modulepreload/stylesheet <link> failed to load.
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (!t) return
          if (t.tagName === 'SCRIPT') { recover(); return }
          if (t.tagName === 'LINK') {
            var rel = (t.getAttribute && t.getAttribute('rel')) || ''
            if (rel === 'modulepreload' || rel === 'stylesheet') recover()
          }
        }, true)
        // Backstop: a chunk that loaded but threw during init leaves #root empty with
        // no resource error — reload once after a generous delay; clear the counter
        // once we know the app mounted.
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (mounted()) { try { sessionStorage.removeItem(KEY) } catch (e) {} }
            else recover()
          }, 15000)
        })
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4A6CF7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DEN Chat" />
    <meta name="description" content="Decentralized encrypted Nostr chat" />
    <title>DEN Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support (browser only, skip Tauri).
      // updateViaCache:'none' — always fetch /sw.js bypassing the HTTP cache when checking for an
      // update; otherwise GitHub Pages' 10-min max-age would delay a new SW taking effect.
      if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {})
        })
      }
    </script>
  </body>
</html>
