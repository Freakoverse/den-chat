[package]
name = "den-chat"
version = "0.5.1"
description = "DEN Chat — Decentralized Encrypted Network Chat"
authors = ["Freakoverse"]
edition = "2021"

[lib]
# The `_lib` suffix prevents name collision with the binary on Windows
# See: https://github.com/rust-lang/cargo/issues/8519
name = "den_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
scraper = "0.22"
url = "2"
tokio = { version = "1", features = ["net"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
nostr-sdk = { version = "0.37", default-features = false, features = ["nip06"] }
bip39 = "2"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
futures-util = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Pin to 2.6.x: the tauri build enforces that the Rust crate and the NPM @tauri-apps/plugin-http share
# a major.minor, and the npm package tops out at 2.6.1 (no 2.7 published), so a bare "2" that resolved
# to the 2.7 crate broke the release build.
tauri-plugin-http = "~2.6"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
