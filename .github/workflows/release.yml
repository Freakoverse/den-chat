name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            args: ''
            label: windows-x64
          # Windows ARM64 (cross-compiled from x64)
          - os: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            label: windows-arm64
          # Linux x64
          - os: ubuntu-22.04
            args: ''
            label: linux-x64
          # Linux ARM64 (native runner)
          - os: ubuntu-24.04-arm
            args: ''
            label: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        if: matrix.label == 'windows-arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Linux dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxtst-dev libx11-dev libxdo-dev xdg-utils

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DEN Chat v__VERSION__'
          releaseBody: 'See the assets below to download and install DEN Chat for your platform.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: '.'
          tauriScript: npx -y @tauri-apps/cli
